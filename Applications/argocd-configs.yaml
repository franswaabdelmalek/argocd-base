apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-configs
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/franswaabdelmalek/argocd-base.git
      targetRevision: HEAD
      path: configs/argocd
      ref: configs
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 2.43.0
      chart: argo-rollouts
      helm:
        valueFiles:
          - $configs/value-files/argo-rollouts-values.yaml
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 2.0.3
      chart: argo-workflows
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true