apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-configs
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/franswaabdelmalek/argocd-base.git
      targetRevision: HEAD
      path: configs/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true