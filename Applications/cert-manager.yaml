apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: cert-manager
  sources:
    - repoURL: https://charts.jetstack.io
      targetRevision: 1.21.1
      chart: cert-manager
      helm:
        valueFiles:
          - $configs/configs/values/cert-manager-values.yaml
    - repoURL: https://github.com/franswaabdelmalek/argocd-base.git
      targetRevision: HEAD
      ref: configs
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true