apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-dashboard-ingress
spec:
  rules:
    - host: headlamp.local
      http:
        paths:
          - path: /headlamp
            pathType: Exact
            backend:
              service: 
                name: headlamp
                port:
                  number: 80