apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-dashboard-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: headlamp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: 
                name: headlamp
                port:
                  number: 80